<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нэвтрэх / Бүртгүүлэх</title>

<style>
body {
   margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background-image:url("https://static.vecteezy.com/system/resources/previews/023/901/783/original/cows-in-field-illustration-ai-generative-free-photo.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    font-family:Arial, sans-serif;
}
input[type="radio"]{
    display:none;
}
.box {
    width:360px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:40px 30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    color:white;
}
.login, .register{
    display:none;
}
#login:checked ~ .box .login{
    display:block;
}
#register:checked ~ .box .register{
    display:block;
}
h2{
    margin-bottom:10px;
}
input, textarea{
    width:100%;
    max-width:280px;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:6px;
}

textarea{
    height:70px;
    resize:none;
}
.remember-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    max-width:280px;
    margin:10px auto;
}

.remember{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    cursor:pointer;
}

.remember input{
    width:16px;
    height:16px;
    cursor:pointer;
}

.forgot{
    font-size:13px;
    color:white;
    text-decoration:none;
    opacity:0.8;
}

.forgot:hover{
    opacity:1;
    text-decoration:underline;
}
button{
    width:100%;
    max-width:280px;
    padding:10px;
    border:none;
    background:#2e7d32;
    color:white;
    font-weight:bold;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#256428;
}
.switch{
    margin-top:15px;
    font-size:14px;
    cursor:pointer;
}
</style>
</head>
<body>
<input type="radio" name="tab" id="login" checked>
<input type="radio" name="tab" id="register">
<div class="box">
<div class="login">
<h2>Нэвтрэх</h2>
<form>
    <input type="email" placeholder="Имэйл" required>
    <input type="password" placeholder="Нууц үг" required>

    <div class="remember-row">
        <label class="remember">
            <input type="checkbox">
            <span>Намайг сана</span>
        </label>

        <a href="#" class="forgot">Нууц үг мартсан уу?</a>
    </div>

    <button type="submit">НЭВТРЭХ</button>
</form>

<div class="switch">
    <label for="register">Бүртгүүлэх</label>
</div>
</div>
<div class="register">
<h2>Бүртгүүлэх</h2>
<form>
    <input type="text" placeholder="Бүтэн нэр" required>
    <input type="email" placeholder="Имэйл" required>
    <input type="password" placeholder="Нууц үг" required>
    <input type="password" placeholder="Нууц үг давтах" required>
    <textarea placeholder="Нэмэлт мэдээлэл..."></textarea>

    <button type="submit">БҮРТГҮҮЛЭХ</button>
</form>

<div class="switch">
    <label for="login">Нэвтрэх</label>
</div>
</div>

</div>

</body>
</html>
