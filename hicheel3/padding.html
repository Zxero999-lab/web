<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Padding Жишээ</title>
<style>
.box {
    width: 200px;
    height: 100px;
    background-color: lightblue;

    /* padding жишээ */
    padding-top: 20px;     /* Дээд талаас 20px */
    padding-right: 30px;   /* Баруун талаас 30px */
    padding-bottom: 20px;  /* Доод талаас 20px */
    padding-left: 30px;    /* Зүүн талаас 30px */
}
</style>
</head>
<body>
<div class="box">Энэ нь padding жишээ текст юм</div>
</body>
</html>
