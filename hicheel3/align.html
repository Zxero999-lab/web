<!DOCTYPE html>
<html>
<head>
<style>
.container {
    height: 150px;
    border: 2px solid black;

    display: flex;
    justify-content: center; /* хэвтээ төв */
    align-items: center;     /* босоо төв */
}

.box {
    width: 100px;
    height: 50px;
    background: lightgreen;
    text-align: center; /* текстийг төвлөрүүлнэ */
}
</style>
</head>
<body>

<div class="container">
    <div class="box">CENTER</div>
</div>

</body>
</html>
