<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 200px;
    height: 100px;

    border-bottom: 3px solid blue; 
    /* элементтэй наалдсан хүрээ */

    outline: 3px dashed red;
    /* гадна талын хүрээ (spacing-д нөлөөлөхгүй) */

    padding: 20px;
    margin: 50px;
}
</style>
</head>
<body>

<div class="box">Border vs Outline</div>

</body>
</html>
