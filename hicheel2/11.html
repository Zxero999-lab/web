<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Page</title>

<style> 
body {
    margin: 0;  
    background: #000;
    font-family: Arial, sans-serif;
}
.top-bar {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: #000000;
    border-bottom: 3px solid #cfe9ff;
}

.tab a button {
    background: #cfe9ff;
    padding: 8px 20px;
    border-radius: 4px;
    font-weight: bold;
    border: none;
    cursor: pointer;
}
.container {
    display: flex;
    gap: 10px;
    padding: 10px;
    height: 70vh;
}
.left {
    width: 250px;
    background: #cfe9ff;
    padding: 15px;
}
.profile-pic {
    width: 100%;
    height: 200px;
    overflow: hidden;
    background: #333;
}

.profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.info {
    margin-top: 15px;
    font-size: 14px;
}

.line {
    border-bottom: 1px solid #000;
    margin: 10px 0;
}
.content {
    flex: 1;
    background: #cfe9ff;
    padding-top: 10px;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}
.footer {
    margin: 10px;
    background: #f3a3ad;
    text-align: center;
    padding: 15px;
    font-weight: bold;
}
@media (max-width:1023px){
    .container {
        flex-direction: row; 
        height: auto;
    }

    .left, .content {
        flex: 1; 
    }

    .profile-pic {
        height: 200px; 
    }

    .top-bar {
        flex-wrap: wrap;
    }
}
@media (max-width:767px){
    .top-bar{
        flex-direction: row; 
        flex-wrap: wrap;      
        justify-content: space-around; 
    }

    .tab {
        width: 48%;  
        margin-bottom: 10px; 
    }

    .tab button{
        width: 100%; 
    }

    .container{
        flex-direction: column;
    }

    .left{
        width:100%;
    }

    .profile-pic{
        height:200px;
    }

    .content{
        height:400px;
    }

    .footer{
        font-size:14px;
    }
}
</style>
</head>
