<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Profile Layout</title>

<style>



.top-menu {
    width: 100%;
    height: 100px;
    display: flex;
    justify-content: center;
    gap: 20px; 
    padding: 10px;
    margin-top: 5px;
    margin-left: 5px;
    margin-right: 5px;
    background: #6bb6e8;
}



.top-menu button {
    
    background: #4379a0;
    padding: 8px 80px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    justify-content: center;
    margin-top: 30px;
    margin-left: 30px;
}



.sidebar {
    width: 20%;
    height: 600px;
    gap: 15px;
    margin: 5px 5px 5px 5px ;
    background: #b6dff8;
    padding: 15px;
}

.profile-pic {
    width: 100%;
    height: 180px;
    background: #777;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
    margin-top: 20px;
}
div {
    float: left;
        }
.info-title {
    
    margin-left: 10px;
    font-weight: bold;
    margin-bottom: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}



.content {
    
    background: #dfeef7;
    width: 75%;
    height: 500px;
    margin: 5px 5px 5px 5px ;
}


.footer {
    
    background: #e58c8c;
    width: 75%;
    height: 100px;
    background-color: rgb(222, 172, 222);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 5px;
    margin-bottom: 5px;

    font-weight: bold;
    margin-bottom: 10px;
    text-align: left;
}



.h3 {
  text-align: left;
}

@media (max-width : 1023px){
    .container{
        flex-direction: column;
        height: auto;
    }
    .sidebar{
        width: 100%;
    }
    .profile-pic{
        height: 250px;
    }
    .content{
        height: 500px;
    }
    .top-menu{
        flex-wrap: wrap;
    }
}
@media (min-width: 767px) {
  .top-menu{
    flex-direction: column;
    align-items: center;
  }
  .top-menu button{
    width: 200px;
  }
  .container{
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
  }
  .profile-pic{
    height: 200px;
  }
  .content{
    height: 400px;
  }
  .footer{
    font-size: 14px;
  }
} 
</style>
</head>
